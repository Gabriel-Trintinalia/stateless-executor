participants_matrix:
  el:
    # glamsterdam-devnet-8-zkevm build — the only EL in the matrix, so every
    # node the executor tracks serves zkEVM-flavoured stateless data.
    - el_type: besu
      el_image: hyperledger/besu:26.8-develop-d1779ae
  cl:
    - cl_type: lodestar
      cl_image: ethpandaops/lodestar:glamsterdam-devnet-8

network_params:
  preset: minimal
  gloas_fork_epoch: 1

# The pipeline prefers engine_getPayloadBodiesByHashV2 for the raw BAL RLP and
# only falls back to reconstructing it from eth_getBlockAccessList JSON, so the
# snooper's engine endpoint is what dev.sh wires into ENGINE_RPC_URL.
snooper_enabled: true

additional_services:
  - assertoor
  - spamoor
  - dora

assertoor_params:
  run_stability_check: false
  run_block_proposal_check: false
  tests:
    - { file: "https://raw.githubusercontent.com/ethpandaops/assertoor/refs/heads/master/playbooks/gloas-dev/builder-lifecycle.yaml" }
    - { file: "https://raw.githubusercontent.com/ethpandaops/assertoor/refs/heads/master/playbooks/gloas-dev/builder-deposit.yaml" }

# Keeps blocks non-empty so the live executor verifies real transactions and
# blob traffic rather than a stream of empty payloads.
spamoor_params:
  spammers:
    - scenario: eoatx
      config:
        throughput: 1
    - scenario: blobs
      config:
        throughput: 1

global_log_level: debug
